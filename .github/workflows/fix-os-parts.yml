name: fix-os-parts
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-os-parts.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply known byte fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          # (path, index, expected_old_or_None, new_char) — insert if old is None and len short
          inserts = [
            ('compressed/pieces/os5_00.txt', 1335, 'r'),  # missing 'r' before tgIpRatlii
          }
          for path, idx, ch in inserts:
            p = Path(path)
            b = bytearray(p.read_bytes())
            if len(b) == 2999 and idx <= len(b):
              print(f'insert {path}[{idx}] {ch!r} ctx={bytes(b[idx-5:idx+5])!r}')
              b[idx:idx] = ch.encode()
              assert len(b) == 3000
              p.write_bytes(b)
              print('fixed', path, 'len', len(b))
            else:
              print('skip', path, 'len', len(b))
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compressed/pieces/os5_00.txt
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix os5_00 missing byte at 1335"
          git push
