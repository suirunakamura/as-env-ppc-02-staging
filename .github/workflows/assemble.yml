name: assemble-ppc-payload
on:
  push:
    branches: [main]
    paths:
      - 'compressed/**'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress zlib payloads
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, pathlib, zlib, hashlib, re
          root = pathlib.Path('compressed')
          def load(name):
            single = root / f'{name}.zlib.b64'
            if single.exists():
              return single.read_text().strip()
            parts = sorted(root.glob(f'{name}.zlib.part*.b64'), key=lambda p: int(re.search(r'part(\d+)', p.name).group(1)))
            if not parts:
              raise SystemExit(f'missing compressed payload for {name}')
            return ''.join(p.read_text().strip() for p in parts)
          mapping = {
            'registry': ('registry_pretty', 'registry.json'),
            'decisions': ('decisions', 'decisions.md'),
            'os': ('os', 'os.md'),
          }
          outdir = pathlib.Path('.')
          for name, (key, dst) in mapping.items():
            data = zlib.decompress(base64.b64decode(load(key)))
            (outdir/dst).write_bytes(data)
            print(name, '->', dst, 'bytes', len(data), 'sha256', hashlib.sha256(data).hexdigest())
          decisions = (outdir/'decisions.md').read_text(encoding='utf-8')
          os_text = (outdir/'os.md').read_text(encoding='utf-8')
          reg = json.loads((outdir/'registry.json').read_text(encoding='utf-8'))
          assert 'D-038' in decisions
          assert 'AS-ENV-PPC-02' in os_text
          assert len(os_text.encode()) > 140000
          assert any(d.get('path') == 'os/環境_身体統合OS_v3_1.md' and d.get('observed_sha') is None for d in reg['documents'])
          print('semantic checks OK')
          PY
      - name: Commit assembled payloads
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json decisions.md os.md
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "assemble AS-ENV-PPC-02 payloads from zlib"
          git push
